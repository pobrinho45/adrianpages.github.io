<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>blog</title>
        <style>
            header {
                background-color: #124C8A;
                color: #FFFFFF;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                border: 2px solid red;
                padding: 16px;
            }
            main {
                background-color: #FFFFFF;
                color: #124C8A;
                text-align: center;
                max-width: 600px;
                margin: 0 auto;
                padding: 10px;
            }
            main img {
                display: block;
                width: 100%;
                max-width: 420px;
                height: auto;
                margin: 0 auto 16px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>meu blog</h1>
            <p>venha me conhecer melhor!</p>
        </header>
        <main>
            <img src="image-blog.jpg" alt="Ilustração de um blog com elementos que representam criatividade e ideias.">
            <h2>meu primeiro post</h2>
            <p>por: Adrian Luis</p>
            <p>boas vindas ao meu primeiro blog</p>
        </main>
    </body>
</html>
